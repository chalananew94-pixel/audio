<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#a855f7;--accent2:#6366f1;--bg:#050510;--surface:rgba(255,255,255,0.05);--border:rgba(255,255,255,0.1);--text:#f0f0ff;--muted:#8888aa}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;display:grid;place-items:center;padding:20px}
body::before{content:'';position:fixed;inset:0;z-index:-1;
  background:radial-gradient(ellipse 70% 50% at 20% 10%,rgba(168,85,247,.25),transparent),
             radial-gradient(ellipse 60% 40% at 80% 80%,rgba(99,102,241,.2),transparent),
             radial-gradient(ellipse 50% 60% at 50% 50%,rgba(5,5,16,1),transparent)}
.card{width:min(420px,100%);background:rgba(255,255,255,.04);border:1px solid var(--border);
  border-radius:24px;padding:44px 36px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(168,85,247,.1);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);animation:fadeUp .5s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.brand{text-align:center;margin-bottom:32px}
.brand-logo{max-height:56px;object-fit:contain;margin-bottom:12px;border-radius:12px}
.brand-name{font-size:28px;font-weight:800;background:linear-gradient(135deg,#a855f7,#6366f1);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.5px}
.brand-sub{color:var(--muted);font-size:14px;margin-top:6px}
.lock-icon{font-size:44px;margin-bottom:8px}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:18px}
label{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
input[type=password]{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--border);
  background:rgba(255,255,255,.04);color:var(--text);font-size:15px;outline:none;transition:border-color .2s,box-shadow .2s}
input[type=password]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(168,85,247,.15)}
.btn{width:100%;padding:14px;border-radius:12px;border:none;
  background:linear-gradient(135deg,#a855f7,#6366f1);color:#fff;font-size:15px;font-weight:700;
  cursor:pointer;transition:opacity .2s,transform .2s;margin-top:4px}
.btn:hover{opacity:.88;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.error{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.25);color:#fca5a5;
  border-radius:10px;padding:11px 14px;font-size:13px;text-align:center;margin-bottom:16px}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <img id="brand-logo" class="brand-logo" src="" alt="" style="display:none">
    <div class="lock-icon">🔐</div>
    <div class="brand-name" id="brand-name">LinkGen</div>
    <div class="brand-sub">Admin Panel — Authorised Access Only</div>
  </div>
  <div id="err-msg" class="error" style="display:none">Incorrect password. Please try again.</div>
  <form action="/login" method="post">
    <div class="field">
      <label>Admin Password</label>
      <input type="password" name="password" placeholder="Enter your password" required autofocus autocomplete="current-password">
    </div>
    <button type="submit" class="btn">Sign In →</button>
  </form>
</div>
<script>
const p = new URLSearchParams(location.search);
if (p.get('error')) document.getElementById('err-msg').style.display = 'block';
fetch('/api/settings').then(r=>r.json()).then(s=>{
  if(s.site_name) document.getElementById('brand-name').textContent = s.site_name;
  if(s.logo){ const img=document.getElementById('brand-logo'); img.src=s.logo; img.style.display='block'; document.querySelector('.lock-icon').style.display='none'; }
  if(s.favicon){ const lnk=document.createElement('link'); lnk.rel='icon'; lnk.href=s.favicon; document.head.appendChild(lnk); }
  document.title = (s.site_name||'LinkGen') + ' — Admin Login';
}).catch(()=>{});
</script>
</body>
</html>
